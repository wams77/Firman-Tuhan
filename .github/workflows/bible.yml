name: Auto Bible Reels Bot

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 06:00 WITA (22:00 UTC)
    - cron: '0 22 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-bible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install moviepy requests google-generativeai pillow edge-tts

      - name: Jalankan Bot Firman Tuhan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python bible_reels_bot.py
